# Settings for the LLM gateway (no secrets here: API keys go in .env)
# ${NAME:-default} reads environment variable NAME, or uses the default when it's not set.
# Docker Compose sets these so the same file works inside containers.

# Where requests can be sent
providers:
  ollama:
    type: openai # Ollama speaks the OpenAI format
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
    timeout_seconds: 60

  # Uncomment to use Claude models (needs ANTHROPIC_API_KEY in .env)
  # anthropic:
  #   type: anthropic
  #   base_url: https://api.anthropic.com
  #   api_key_env: ANTHROPIC_API_KEY
  #   timeout_seconds: 120

# Temporary failures (timeouts, 429, 5xx) are retried with exponential backoff
retry:
  max_attempts: 3
  initial_backoff_seconds: 0.5
  max_backoff_seconds: 4

# Model names clients can ask for, and where each one goes
models:
  "llama3.2:1b":
    provider: ollama
    model: llama3.2:1b
  "llama3.2:3b":
    provider: ollama
    model: llama3.2
  # Aliases: apps ask for "fast" or "smart" and the gateway decides which model that means
  fast:
    provider: ollama
    model: llama3.2:1b
    fallbacks: [smart] # if the small model keeps failing, use the bigger one
  smart:
    provider: ollama
    model: llama3.2
    fallbacks: [fast]

  # Local models are free, so they have no pricing. For paid models, add the price list
  # (US dollars per million tokens) and GET /usage will estimate cost and cache savings.
  # claude:
  #   provider: anthropic
  #   model: claude-opus-5-5
  #   drop_params: [temperature, top_p] # this model rejects sampling parameters
  #   pricing:
  #     input_per_million: 4.00
  #     output_per_million: 20.00

# Redis holds the cache, rate limit counters and usage numbers
redis:
  url: ${REDIS_URL:-redis://localhost:6379/0}
  timeout_seconds: 0.25 # a slow Redis must never slow down the gateway

cache:
  shared_across_keys: false # each API key gets its own cache entries
  max_temperature: 0.3 # only cache low-randomness requests
  exact:
    enabled: true
    ttl_seconds: 3600
  # Reuses answers for questions that mean the same thing (see docs/semantic-cache.md)
  semantic:
    enabled: true
    embedding_model: BAAI/bge-small-en-v1.5
    similarity_threshold: 0.94 # tuned: 0 wrong answers on 90 labeled pairs
    ttl_seconds: 3600

# Requests allowed per API key (sliding window); over the limit gets 429 + Retry-After
rate_limit:
  enabled: true
  requests_per_minute: 60
  window_seconds: 60
  per_key: {} # e.g. key_1a2b3c4d5e6f: 600
