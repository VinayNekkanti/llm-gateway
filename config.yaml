# Settings for the LLM gateway (no secrets here: API keys go in .env)

# Where requests can be sent
providers:
  ollama:
    type: openai # Ollama speaks the OpenAI format
    base_url: http://localhost:11434/v1
    timeout_seconds: 60

  # Uncomment to use Claude models (needs ANTHROPIC_API_KEY in .env)
  # anthropic:
  #   type: anthropic
  #   base_url: https://api.anthropic.com
  #   api_key_env: ANTHROPIC_API_KEY
  #   timeout_seconds: 120

# Model names clients can ask for, and where each one goes
models:
  "llama3.2:1b":
    provider: ollama
    model: llama3.2:1b
  "llama3.2:3b":
    provider: ollama
    model: llama3.2
  # Aliases: apps ask for "fast" or "smart" and the gateway decides which model that means
  fast:
    provider: ollama
    model: llama3.2:1b
  smart:
    provider: ollama
    model: llama3.2

  # claude:
  #   provider: anthropic
  #   model: claude-opus-5-5
  #   drop_params: [temperature, top_p] # this model rejects sampling parameters
