# Benchmark config: one mock provider that answers instantly (benchmarks/mock_upstream.py)
providers:
  mock:
    type: openai
    base_url: http://127.0.0.1:9100/v1
    timeout_seconds: 10

models:
  bench:
    provider: mock
    model: mock-model
    # Priced like a mid-range hosted model so "cost saved" means something
    pricing:
      input_per_million: 3.00
      output_per_million: 15.00

redis:
  url: redis://localhost:6379/2 # separate database, wiped before each run
  timeout_seconds: 0.25

cache:
  shared_across_keys: false
  max_temperature: 0.3
  exact:
    enabled: true
    ttl_seconds: 3600
  semantic:
    enabled: true
    similarity_threshold: 0.94
    ttl_seconds: 3600

rate_limit:
  enabled: true # still checked on every request, so its cost is included
  requests_per_minute: 100000000
